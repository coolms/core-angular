name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly, so a break from a dependency or a toolchain release shows up on a
  # Monday rather than inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # The steps live in coolms/.github because all eight ng-packagr packages have
  # byte-identical scripts. Two copies of them had already drifted.
  ci:
    uses: coolms/.github/.github/workflows/angular-library.yml@develop
    with:
      bundle: dist/fesm2022/coolms-core-angular.mjs

